<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>Play with Friends — Tic Tac Toe & Chess</title>
<meta name="description" content="Peer-to-peer Tic Tac Toe and Chess. No signup, no server. Share a code, play instantly." />

<!-- Third-party libraries -->
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://unpkg.com/chess.js@1.0.0-beta.8/dist/chess.min.js"></script>

<!-- Styles: theme.css has all shared/base styles, each game adds its own -->
<link rel="stylesheet" href="css/theme.css" />
<link rel="stylesheet" href="css/ttt.css" />
<link rel="stylesheet" href="css/chess.css" />
</head>
<body>

<div class="wrap">

  <div class="brand">
    <h1><span class="x">X</span>/<span class="o">O</span> &amp; Chess</h1>
    <div class="brand-right">
      <button class="sound-toggle" id="soundToggle" title="Toggle sound">🔊</button>
      <div class="status-pill" id="statusPill"><span class="dot"></span><span id="statusText">Offline</span></div>
    </div>
  </div>

  <!-- GAME PICKER (populated dynamically from GameRegistry in main.js) -->
  <div class="screen active" id="picker">
    <div class="lobby-card">
      <h2>Choose a game</h2>
      <div class="picker-grid" id="pickerGrid"></div>
    </div>
    <button class="btn btn-primary" id="pickerNextBtn">Continue</button>
  </div>

  <!-- LOBBY -->
  <div class="screen" id="lobby">
    <div class="lobby-card">
      <h2>Start a game</h2>
      <button class="btn btn-primary" id="hostBtn">Create Room</button>
    </div>

    <div class="divider">or</div>

    <div class="lobby-card">
      <h2>Join a friend</h2>
      <div class="join-row">
        <input type="text" id="joinInput" placeholder="Enter room code" maxlength="10" autocomplete="off" autocapitalize="off" spellcheck="false" />
        <button class="btn btn-primary" id="joinBtn" style="width:auto; padding-left:22px; padding-right:22px;">Join</button>
      </div>
    </div>

    <div class="back-row">
      <button class="btn btn-ghost" id="backToPickerBtn">← Change game</button>
    </div>
  </div>

  <!-- HOSTING / WAITING -->
  <div class="screen" id="hosting">
    <div class="code-label">Share this code</div>
    <div class="code-display" id="roomCode">••••••</div>
    <div class="waiting-dots"><span></span><span></span><span></span></div>
    <div style="color:var(--text-dim); font-size:13px;">Waiting for your friend to join…</div>
    <div class="share-row">
      <button class="btn btn-secondary" id="copyCodeBtn">Copy Code</button>
      <button class="btn btn-secondary" id="shareBtn">Share Link</button>
    </div>
    <button class="btn btn-ghost" id="cancelHostBtn">Cancel</button>
  </div>

  <!-- GAME -->
  <div class="screen" id="game">
    <div class="players-row">
      <div class="player-badge x" id="badgeX">
        <div class="mark" id="markX">X</div>
        <div class="info">
          <div class="name" id="nameX">You</div>
          <div class="role" id="roleX">Player 1</div>
        </div>
      </div>
      <div class="player-badge o" id="badgeO">
        <div class="mark" id="markO">O</div>
        <div class="info">
          <div class="name" id="nameO">Friend</div>
          <div class="role" id="roleO">Player 2</div>
        </div>
      </div>
    </div>

    <div class="captured-row" id="capturedRow" hidden>
      <span id="capturedTop">&nbsp;</span>
      <span id="capturedBottom">&nbsp;</span>
    </div>

    <div class="turn-banner" id="turnBanner">—</div>

    <!-- Each game module renders into its own element below. main.js shows/hides
         these based on which game is active; only one is visible at a time. -->
    <div class="board" id="board" hidden></div>

    <div class="chess-wrap" id="chessWrap" hidden>
      <div class="chess-board" id="chessBoard"></div>
    </div>

    <div class="result-banner" id="resultBanner"></div>
    <div class="disconnect-banner" id="disconnectBanner">Your friend disconnected.</div>

    <div class="game-actions">
      <button class="btn btn-secondary" id="rematchBtn">Rematch</button>
      <button class="btn btn-ghost" id="leaveBtn">Leave</button>
    </div>

    <div class="chat-scrim" id="chatScrim"></div>
    <div class="chat-toggle" id="chatToggle">
      <div class="left">💬 Chat <span class="badge" id="chatBadge">0</span></div>
      <span class="chevron">▾</span>
    </div>
    <div class="chat-panel" id="chatPanel">
      <div class="chat-panel-handle"><span></span></div>
      <div class="chat-messages" id="chatMessages">
        <div class="chat-empty">Say hi 👋</div>
      </div>
      <div class="chat-quick-row">
        <button data-emoji="👍">👍</button>
        <button data-emoji="😂">😂</button>
        <button data-emoji="🔥">🔥</button>
        <button data-emoji="😱">😱</button>
        <button data-emoji="🤝">🤝</button>
      </div>
      <div class="chat-input-row">
        <input type="text" id="chatInput" placeholder="Type a message…" maxlength="200" autocomplete="off" />
        <button class="chat-send-btn" id="chatSendBtn">Send</button>
      </div>
    </div>
  </div>

  <div class="footer-note">Peer-to-peer via WebRTC · no account, no data stored</div>
</div>

<div class="promo-overlay" id="promoOverlay">
  <div class="promo-card">
    <div class="t">Promote pawn to</div>
    <div class="promo-options" id="promoOptions"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- App code as ES modules — see js/main.js for the entry point and
     js/README.md (if present) for the folder layout. -->
<script type="module" src="js/main.js"></script>

</body>
</html>
