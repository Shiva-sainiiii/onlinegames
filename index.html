<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>Tic Tac Toe — Play with Friends</title>
<meta name="description" content="Peer-to-peer Tic Tac Toe. No signup, no server. Share a code, play instantly." />
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root{
    --bg: #0B0E14;
    --bg-raised: #12161F;
    --line: #232838;
    --text: #E7EAF2;
    --text-dim: #7E869B;
    --x-color: #4CD3FF;
    --x-glow: rgba(76, 211, 255, 0.35);
    --o-color: #FF6B6B;
    --o-glow: rgba(255, 107, 107, 0.35);
    --amber: #FFB84C;
    --win: #6BFFB0;
    --radius: 18px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100svh;
    overscroll-behavior: none;
  }

  body {
    background-image:
      radial-gradient(circle at 15% 10%, rgba(76,211,255,0.05), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(255,107,107,0.05), transparent 40%);
  }

  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 28px 20px 40px;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Header ---------- */
  .brand {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 24px;
  }
  .brand h1 {
    font-family: 'Georgia', serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: -0.02em;
    margin: 0;
  }
  .brand h1 .x { color: var(--x-color); }
  .brand h1 .o { color: var(--o-color); }
  .status-pill {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 5px 10px;
    border-radius: 100px;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  .status-pill .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-dim);
  }
  .status-pill.connected { color: var(--win); border-color: rgba(107,255,176,0.3); }
  .status-pill.connected .dot { background: var(--win); box-shadow: 0 0 8px var(--win); }
  .status-pill.waiting { color: var(--amber); border-color: rgba(255,184,76,0.3); }
  .status-pill.waiting .dot { background: var(--amber); animation: pulse 1.2s ease-in-out infinite; }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.7); }
  }

  /* ---------- Screens ---------- */
  .screen { display: none; flex: 1; flex-direction: column; }
  .screen.active { display: flex; }

  /* ---- Lobby ---- */
  #lobby { justify-content: center; gap: 14px; }

  .lobby-card {
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 22px;
  }
  .lobby-card h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    margin: 0 0 14px;
    font-weight: 700;
  }

  .btn {
    appearance: none;
    border: none;
    border-radius: 12px;
    padding: 15px 18px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
    font-family: inherit;
    transition: transform 0.12s ease, opacity 0.12s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary {
    background: linear-gradient(135deg, var(--x-color), #2FA8D6);
    color: #06131A;
  }
  .btn-secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--line);
  }
  .btn-ghost {
    background: transparent;
    color: var(--text-dim);
    font-weight: 600;
    font-size: 13px;
    padding: 10px;
  }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--text-dim);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin: 4px 0;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  .join-row {
    display: flex;
    gap: 8px;
  }
  input[type="text"] {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    color: var(--text);
    font-size: 16px;
    font-family: 'SF Mono', 'Roboto Mono', monospace;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    min-width: 0;
  }
  input[type="text"]:focus {
    outline: none;
    border-color: var(--x-color);
  }
  input[type="text"]::placeholder {
    text-transform: none;
    letter-spacing: normal;
    color: var(--text-dim);
    font-family: inherit;
  }

  /* ---- Hosting / waiting ---- */
  #hosting { justify-content: center; align-items: center; text-align: center; gap: 18px; }
  .code-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    font-weight: 700;
  }
  .code-display {
    font-family: 'SF Mono', 'Roboto Mono', monospace;
    font-size: 40px;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--amber);
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 22px 16px;
    width: 100%;
    word-break: break-all;
    line-height: 1.2;
  }
  .waiting-dots { display: flex; gap: 6px; justify-content: center; }
  .waiting-dots span {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--amber);
    animation: bounce 1.4s ease-in-out infinite;
  }
  .waiting-dots span:nth-child(2) { animation-delay: 0.15s; }
  .waiting-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-6px); opacity: 1; }
  }
  .share-row { display: flex; gap: 8px; width: 100%; }

  /* ---- Game ---- */
  #game { gap: 18px; }

  .players-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
  }
  .player-badge {
    flex: 1;
    background: var(--bg-raised);
    border: 1.5px solid var(--line);
    border-radius: 14px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .player-badge .mark {
    font-family: Georgia, serif;
    font-weight: 700;
    font-size: 20px;
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 8px;
    flex-shrink: 0;
  }
  .player-badge.x .mark { color: var(--x-color); background: rgba(76,211,255,0.12); }
  .player-badge.o .mark { color: var(--o-color); background: rgba(255,107,107,0.12); }
  .player-badge .info { min-width: 0; }
  .player-badge .name { font-size: 13px; font-weight: 700; }
  .player-badge .role { font-size: 11px; color: var(--text-dim); }
  .player-badge.active.x { border-color: var(--x-color); box-shadow: 0 0 0 3px var(--x-glow); }
  .player-badge.active.o { border-color: var(--o-color); box-shadow: 0 0 0 3px var(--o-glow); }

  .turn-banner {
    text-align: center;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-dim);
    min-height: 20px;
  }
  .turn-banner strong.x { color: var(--x-color); }
  .turn-banner strong.o { color: var(--o-color); }

  .board {
    aspect-ratio: 1;
    width: 100%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    background: var(--line);
    border-radius: var(--radius);
    padding: 8px;
    position: relative;
  }
  .cell {
    background: var(--bg-raised);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.15s ease;
  }
  .cell:active { background: #171C28; }
  .cell.filled { cursor: default; }
  .cell.win-cell { background: rgba(107,255,176,0.1); }
  .cell svg { width: 56%; height: 56%; overflow: visible; }
  .cell .mark-x { stroke: var(--x-color); filter: drop-shadow(0 0 10px var(--x-glow)); }
  .cell .mark-o { stroke: var(--o-color); filter: drop-shadow(0 0 10px var(--o-glow)); }
  .cell path, .cell circle {
    fill: none;
    stroke-width: 9;
    stroke-linecap: round;
    stroke-dasharray: 300;
    stroke-dashoffset: 300;
    animation: draw 0.35s ease forwards;
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  .board.disabled { pointer-events: none; opacity: 0.85; }

  .result-banner {
    text-align: center;
    padding: 14px;
    border-radius: 14px;
    font-weight: 700;
    font-size: 15px;
    display: none;
  }
  .result-banner.show { display: block; }
  .result-banner.win { background: rgba(107,255,176,0.12); color: var(--win); border: 1px solid rgba(107,255,176,0.3); }
  .result-banner.lose { background: rgba(255,107,107,0.1); color: var(--o-color); border: 1px solid rgba(255,107,107,0.25); }
  .result-banner.draw { background: rgba(126,134,155,0.12); color: var(--text-dim); border: 1px solid var(--line); }

  .game-actions { display: flex; gap: 10px; }

  .disconnect-banner {
    text-align: center;
    font-size: 13px;
    color: var(--o-color);
    background: rgba(255,107,107,0.08);
    border: 1px solid rgba(255,107,107,0.2);
    border-radius: 12px;
    padding: 10px;
    display: none;
  }
  .disconnect-banner.show { display: block; }

  .footer-note {
    text-align: center;
    font-size: 11px;
    color: var(--text-dim);
    margin-top: auto;
    padding-top: 24px;
    line-height: 1.6;
  }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--bg-raised);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 10px 18px;
    border-radius: 100px;
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 100;
    white-space: nowrap;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  ::selection { background: var(--x-glow); }
</style>
</head>
<body>

<div class="wrap">

  <div class="brand">
    <h1><span class="x">X</span>/<span class="o">O</span> Online</h1>
    <div class="status-pill" id="statusPill"><span class="dot"></span><span id="statusText">Offline</span></div>
  </div>

  <!-- LOBBY -->
  <div class="screen active" id="lobby">
    <div class="lobby-card">
      <h2>Start a game</h2>
      <button class="btn btn-primary" id="hostBtn">Create Room</button>
    </div>

    <div class="divider">or</div>

    <div class="lobby-card">
      <h2>Join a friend</h2>
      <div class="join-row">
        <input type="text" id="joinInput" placeholder="Enter room code" maxlength="10" autocomplete="off" autocapitalize="off" spellcheck="false" />
        <button class="btn btn-primary" id="joinBtn" style="width:auto; padding-left:22px; padding-right:22px;">Join</button>
      </div>
    </div>
  </div>

  <!-- HOSTING / WAITING -->
  <div class="screen" id="hosting">
    <div class="code-label">Share this code</div>
    <div class="code-display" id="roomCode">••••••</div>
    <div class="waiting-dots"><span></span><span></span><span></span></div>
    <div style="color:var(--text-dim); font-size:13px;">Waiting for your friend to join…</div>
    <div class="share-row">
      <button class="btn btn-secondary" id="copyCodeBtn">Copy Code</button>
      <button class="btn btn-secondary" id="shareBtn">Share Link</button>
    </div>
    <button class="btn btn-ghost" id="cancelHostBtn">Cancel</button>
  </div>

  <!-- GAME -->
  <div class="screen" id="game">
    <div class="players-row">
      <div class="player-badge x" id="badgeX">
        <div class="mark">X</div>
        <div class="info">
          <div class="name" id="nameX">You</div>
          <div class="role">Player 1</div>
        </div>
      </div>
      <div class="player-badge o" id="badgeO">
        <div class="mark">O</div>
        <div class="info">
          <div class="name" id="nameO">Friend</div>
          <div class="role">Player 2</div>
        </div>
      </div>
    </div>

    <div class="turn-banner" id="turnBanner">—</div>

    <div class="board" id="board"></div>

    <div class="result-banner" id="resultBanner"></div>
    <div class="disconnect-banner" id="disconnectBanner">Your friend disconnected.</div>

    <div class="game-actions">
      <button class="btn btn-secondary" id="rematchBtn">Rematch</button>
      <button class="btn btn-ghost" id="leaveBtn">Leave</button>
    </div>
  </div>

  <div class="footer-note">Peer-to-peer via WebRTC · no account, no data stored</div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  // ---------------- State ----------------
  let peer = null;
  let conn = null;
  let isHost = false;
  let mySymbol = null;   // 'X' or 'O'
  let board = Array(9).fill(null);
  let currentTurn = 'X';
  let gameOver = false;
  let myScore = 0, oppScore = 0;
  let roomCodeVal = '';

  const WIN_LINES = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  // ---------------- DOM ----------------
  const $ = (id) => document.getElementById(id);
  const screens = {
    lobby: $('lobby'), hosting: $('hosting'), game: $('game')
  };
  const statusPill = $('statusPill');
  const statusText = $('statusText');
  const boardEl = $('board');
  const turnBanner = $('turnBanner');
  const resultBanner = $('resultBanner');
  const disconnectBanner = $('disconnectBanner');
  const toastEl = $('toast');
  const badgeX = $('badgeX'), badgeO = $('badgeO');

  function showScreen(name) {
    Object.values(screens).forEach(s => s.classList.remove('active'));
    screens[name].classList.add('active');
  }

  function setStatus(state, text) {
    statusPill.className = 'status-pill' + (state ? ' ' + state : '');
    statusText.textContent = text;
  }

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toastEl.classList.remove('show'), 1800);
  }

  // ---------------- Room code helpers ----------------
  function randomCode() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let s = '';
    for (let i = 0; i < 5; i++) s += chars[Math.floor(Math.random() * chars.length)];
    return s;
  }
  function peerIdFromCode(code) {
    return 'ttt-' + code.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
  }

  // ---------------- Board rendering ----------------
  function buildBoardDom() {
    boardEl.innerHTML = '';
    for (let i = 0; i < 9; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.idx = i;
      cell.addEventListener('click', () => onCellClick(i));
      boardEl.appendChild(cell);
    }
  }

  function markSvg(symbol) {
    if (symbol === 'X') {
      return `<svg class="mark-x" viewBox="0 0 100 100">
        <path d="M20,20 L80,80" style="animation-delay:0s"/>
        <path d="M80,20 L20,80" style="animation-delay:0.12s"/>
      </svg>`;
    }
    return `<svg class="mark-o" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="32"/>
    </svg>`;
  }

  function renderBoard(winLine) {
    const cells = boardEl.children;
    for (let i = 0; i < 9; i++) {
      const cell = cells[i];
      const v = board[i];
      cell.classList.toggle('filled', !!v);
      cell.classList.toggle('win-cell', !!(winLine && winLine.includes(i)));
      cell.innerHTML = v ? markSvg(v) : '';
    }
    boardEl.classList.toggle('disabled', gameOver || currentTurn !== mySymbol);
  }

  function updateTurnBanner() {
    if (gameOver) return;
    if (currentTurn === mySymbol) {
      turnBanner.innerHTML = `<strong class="${mySymbol.toLowerCase()}">Your turn</strong>`;
    } else {
      turnBanner.innerHTML = `Waiting for friend's move…`;
    }
  }

  function updateActiveBadges() {
    badgeX.classList.toggle('active', currentTurn === 'X' && !gameOver);
    badgeO.classList.toggle('active', currentTurn === 'O' && !gameOver);
  }

  function checkWinner() {
    for (const line of WIN_LINES) {
      const [a,b,c] = line;
      if (board[a] && board[a] === board[b] && board[a] === board[c]) {
        return { symbol: board[a], line };
      }
    }
    if (board.every(v => v)) return { symbol: 'draw', line: null };
    return null;
  }

  function finishGame(result) {
    gameOver = true;
    renderBoard(result.line);
    updateActiveBadges();
    turnBanner.textContent = '';
    resultBanner.classList.add('show');
    if (result.symbol === 'draw') {
      resultBanner.className = 'result-banner show draw';
      resultBanner.textContent = "It's a draw!";
    } else if (result.symbol === mySymbol) {
      myScore++;
      resultBanner.className = 'result-banner show win';
      resultBanner.textContent = 'You won! 🎉';
    } else {
      oppScore++;
      resultBanner.className = 'result-banner show lose';
      resultBanner.textContent = 'You lost this round.';
    }
  }

  function onCellClick(i) {
    if (gameOver || board[i] || currentTurn !== mySymbol) return;
    applyMove(i, mySymbol);
    sendMsg({ type: 'move', idx: i, symbol: mySymbol });
  }

  function applyMove(i, symbol) {
    board[i] = symbol;
    const result = checkWinner();
    if (result) {
      finishGame(result);
    } else {
      currentTurn = symbol === 'X' ? 'O' : 'X';
      renderBoard();
      updateTurnBanner();
      updateActiveBadges();
    }
  }

  function resetBoard(startingSymbol) {
    board = Array(9).fill(null);
    currentTurn = startingSymbol || 'X';
    gameOver = false;
    resultBanner.classList.remove('show');
    disconnectBanner.classList.remove('show');
    renderBoard();
    updateTurnBanner();
    updateActiveBadges();
  }

  // ---------------- Networking ----------------
  function sendMsg(obj) {
    if (conn && conn.open) conn.send(obj);
  }

  function setupConnHandlers(c) {
    conn = c;
    conn.on('data', handleMsg);
    conn.on('close', onPeerLeft);
    conn.on('error', (e) => { console.error(e); });
  }

  function handleMsg(msg) {
    switch (msg.type) {
      case 'move':
        applyMove(msg.idx, msg.symbol);
        break;
      case 'rematch-request':
        // Only the host decides the next starter, to avoid both sides picking independently.
        if (isHost) {
          rematchStarter = rematchStarter === 'X' ? 'O' : 'X';
          startRematch(rematchStarter);
          sendMsg({ type: 'rematch-accept', starter: rematchStarter });
        }
        break;
      case 'rematch-accept':
        rematchStarter = msg.starter;
        startRematch(msg.starter);
        break;
      case 'name':
        (mySymbol === 'X' ? $('nameO') : $('nameX')).textContent = msg.name || 'Friend';
        break;
    }
  }

  function onPeerLeft() {
    disconnectBanner.classList.add('show');
    boardEl.classList.add('disabled');
    setStatus('', 'Disconnected');
  }

  function startRematch(starterSuggestedByHost) {
    // Alternate starter each rematch, decided consistently: host alternates and tells guest.
    resetBoard(starterSuggestedByHost);
  }

  // ---------------- Hosting flow ----------------
  let rematchStarter = 'X';

  function createRoom() {
    isHost = true;
    mySymbol = 'X';
    roomCodeVal = randomCode();
    $('roomCode').textContent = roomCodeVal;
    showScreen('hosting');
    setStatus('waiting', 'Waiting…');

    peer = new Peer(peerIdFromCode(roomCodeVal), {
      config: { iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]}
    });

    peer.on('open', () => {
      // ready to accept connections
    });

    peer.on('connection', (c) => {
      setupConnHandlers(c);
      conn.on('open', () => {
        enterGame();
        sendMsg({ type: 'name', name: 'Player' });
      });
    });

    peer.on('error', (err) => {
      console.error(err);
      if (err.type === 'unavailable-id') {
        toast('Code collision, retrying…');
        peer.destroy();
        createRoom();
      } else {
        toast('Connection error. Try again.');
        setStatus('', 'Offline');
        showScreen('lobby');
      }
    });
  }

  function joinRoom(code) {
    if (!code) { toast('Enter a room code'); return; }
    isHost = false;
    mySymbol = 'O';
    setStatus('waiting', 'Connecting…');
    $('joinBtn').disabled = true;

    peer = new Peer({
      config: { iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]}
    });

    peer.on('open', () => {
      const c = peer.connect(peerIdFromCode(code), { reliable: true });
      setupConnHandlers(c);
      conn.on('open', () => {
        enterGame();
        sendMsg({ type: 'name', name: 'Player' });
      });
      // timeout if host code doesn't exist / doesn't respond
      setTimeout(() => {
        if (!conn.open) {
          toast("Couldn't find that room. Check the code.");
          setStatus('', 'Offline');
          $('joinBtn').disabled = false;
          peer.destroy();
        }
      }, 9000);
    });

    peer.on('error', (err) => {
      console.error(err);
      toast("Couldn't find that room. Check the code.");
      setStatus('', 'Offline');
      $('joinBtn').disabled = false;
    });
  }

  function enterGame() {
    setStatus('connected', 'Connected');
    showScreen('game');
    resetBoard('X');
  }

  function leaveGame() {
    if (conn) conn.close();
    if (peer) peer.destroy();
    peer = null; conn = null;
    myScore = 0; oppScore = 0;
    $('joinBtn').disabled = false;
    setStatus('', 'Offline');
    showScreen('lobby');
  }

  // ---------------- Wire up UI ----------------
  buildBoardDom();

  $('hostBtn').addEventListener('click', createRoom);

  $('joinBtn').addEventListener('click', () => joinRoom($('joinInput').value));
  $('joinInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') joinRoom($('joinInput').value);
  });
  $('joinInput').addEventListener('input', (e) => {
    e.target.value = e.target.value.toUpperCase();
  });

  $('cancelHostBtn').addEventListener('click', () => {
    if (peer) peer.destroy();
    peer = null;
    setStatus('', 'Offline');
    showScreen('lobby');
  });

  $('copyCodeBtn').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(roomCodeVal);
      toast('Code copied!');
    } catch {
      toast(roomCodeVal);
    }
  });

  $('shareBtn').addEventListener('click', async () => {
    const url = `${location.origin}${location.pathname}?room=${roomCodeVal}`;
    const text = `Play Tic Tac Toe with me! Join with code ${roomCodeVal} or open: ${url}`;
    if (navigator.share) {
      try { await navigator.share({ text }); } catch {}
    } else {
      try {
        await navigator.clipboard.writeText(text);
        toast('Link copied!');
      } catch {
        toast(url);
      }
    }
  });

  $('leaveBtn').addEventListener('click', leaveGame);

  $('rematchBtn').addEventListener('click', () => {
    if (!gameOver && board.some(v => v)) return; // ignore mid-game
    if (isHost) {
      rematchStarter = rematchStarter === 'X' ? 'O' : 'X';
      startRematch(rematchStarter);
      sendMsg({ type: 'rematch-accept', starter: rematchStarter });
    } else {
      sendMsg({ type: 'rematch-request' });
    }
  });

  // Auto-fill join code from ?room= link
  const params = new URLSearchParams(location.search);
  const roomParam = params.get('room');
  if (roomParam) {
    $('joinInput').value = roomParam.toUpperCase();
  }

  window.addEventListener('beforeunload', () => {
    if (conn) conn.close();
  });

})();
</script>

</body>
</html>
